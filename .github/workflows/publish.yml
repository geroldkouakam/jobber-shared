# This workflow publishes the package to npm on push or pull request to master branch using GitHub Actions.
# It requires an NPM_TOKEN secret to authenticate with npm.
# Ensure you have set the NPM_TOKEN secret in your repository settings.

name: Publish
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code  # Checkout the repository code checkout@v4 //
        uses: actions/checkout@v4

      - name: Set up Node.js # Set up Node.js environment setup-node@v4
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'  # Specify the Node.js version

      - name: Install dependencies   # Install project dependencies
        run: npm install

      - name: Build project         # Build the project 
        run: npm run build

      - name: Copy and Append to files npmrc tests             # Copy and Append to files npmrc ///
        run: |
          mkdir -p build
          echo "@geroldkouakam:https://npm.pkg.github.com" > build/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" >> build/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      
      - name: Debug build contents
        run: |
          echo "Contents of build/"
          ls -la build/
          echo "------"
          cat build/.npmrc
          echo "------"
          cat build/package.json
    

      - name: Publish package       # Publish the package to npm
        run: npm publish 
        working-directory: ./build
        env: 
          NPM_TOKEN: ${NPM_TOKEN}