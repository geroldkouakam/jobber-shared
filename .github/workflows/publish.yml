# This workflow publishes the package to npm on push or pull request to master branch using GitHub Actions.
# It requires an NPM_TOKEN secret to authenticate with npm.
# Ensure you have set the NPM_TOKEN secret in your repository settings.

name: Publish Package

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          # This automatically authenticates to GitHub Packages using NODE_AUTH_TOKEN
          registry-url: 'https://npm.pkg.github.com/'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Create .npmrc for publishing
        run: |
          echo "@geroldkouakam:registry=https://npm.pkg.github.com/" > build/.npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> build/.npmrc

      - name: Publish package
        run: npm publish
        working-directory: ./build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      

    